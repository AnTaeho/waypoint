name: Waypoint
options:
  bundleIdPrefix: dev.antaeho
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WaypointKit:
    path: .
  # 자동 업데이트(TRK-56). macOS 타깃만 쓴다. 판을 올릴 때는 docs/RELEASE.md 「자동 업데이트」를 본다.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Waypoint:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App
      - path: macOS
        destinationFilters: [macOS]
      - path: iOS
        destinationFilters: [iOS]
      # 앱 안 연동 설치기(`IntegrationSources.bundle`)가 쓰는 원본. 저장소 파일을 빌드 때 그대로 복사한다(따로 두지 않는다).
      - path: integration/hooks/waypoint-hook.sh
        buildPhase: resources
        destinationFilters: [macOS]
      - path: integration/statusline/waypoint-statusline-tap.sh
        buildPhase: resources
        destinationFilters: [macOS]
      - path: integration/codex/waypoint-codex-hook.sh
        buildPhase: resources
        destinationFilters: [macOS]
      - path: integration/skills/tracker/SKILL.md
        buildPhase: resources
        destinationFilters: [macOS]
    dependencies:
      - package: WaypointKit
      - package: Sparkle
        destinationFilters: [macOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.antaeho.waypoint
        PRODUCT_NAME: Waypoint
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Waypoint
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPad 멀티태스킹은 네 방향이 다 있어야 한다(없으면 빌드 경고).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        # 개인 유료 팀. CloudKit·푸시 엔타이틀먼트는 프로파일이 있어야 서명된다(애드혹 서명 불가).
        # 빌드는 `-allowProvisioningUpdates`로 App ID·iCloud 컨테이너·프로파일을 자동으로 만든다.
        DEVELOPMENT_TEAM: 2FCXA77MC5
        CODE_SIGN_IDENTITY: Apple Development
        # CloudKit 컨테이너. 엔타이틀먼트가 이 값을 쓰고, 앱은 `AppInstance.cloudKitContainerIdentifier`로 같은 값을 연다.
        WAYPOINT_CONTAINER: iCloud.dev.antaeho.waypoint
        # iCloud 동기화를 켜고 빌드하는가. Info.plist `WaypointICloud`로 들어가 `AppInstance.cloudKitContainer`가 읽는다.
        # 평소용·개발용은 켬. 외부 베타 배포(`scripts/release-mac.sh`)만 기본으로 NO를 넘긴다. 엔타이틀먼트는 그대로 둔다.
        WAYPOINT_ICLOUD: YES
        # 자동 업데이트(TRK-56). Info.plist `SUFeedURL`·`SUPublicEDKey`로 들어가 `UpdateFeed`가 읽는다.
        # 피드 주소가 비어 있으면 업데이트 기능이 꺼진다(메뉴·설정 항목도 숨김). 평소용·개발용은 늘 비워 둔다.
        # 외부 베타 배포(`scripts/release-mac.sh --feed-url <주소>`)만 값을 넘긴다.
        WAYPOINT_FEED_URL: ""
        # 업데이트 서명 공개 키. 개인 키는 이 Mac 로그인 키체인(계정 dev.antaeho.waypoint)에만 있다(docs/RELEASE.md).
        WAYPOINT_UPDATE_PUBLIC_KEY: rQ94D4N8zL7HR322vQkicieI0AwuMkKgVIPX40PSgkE=
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Waypoint-macOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Config/Waypoint-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Config/Waypoint-iOS.entitlements
        # macOS: `WaypointICloud`(위 WAYPOINT_ICLOUD), 자동 업데이트 키(`SU…`). 나머지 Info.plist 키는 생성한다.
        "INFOPLIST_FILE[sdk=macosx*]": Config/Waypoint-macOS-Info.plist
        # iOS만: 원격 알림(백그라운드)으로 CloudKit 변경을 받는다. 나머지 Info.plist 키는 생성한다.
        "INFOPLIST_FILE[sdk=iphoneos*]": Config/Waypoint-iOS-Info.plist
        "INFOPLIST_FILE[sdk=iphonesimulator*]": Config/Waypoint-iOS-Info.plist
        SWIFT_STRICT_CONCURRENCY: complete
        # 앱 아이콘(이정표). 원본 SVG는 design/icon/
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Debug는 개발용 Waypoint Dev: 번들 ID가 달라 평소용(Release)과 함께 떠 있을 수 있고,
      # 앱이 이 ID로 포트(47822)·저장 폴더(Waypoint-Dev)를 고른다(`AppInstance`).
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.antaeho.waypoint.dev
          INFOPLIST_KEY_CFBundleDisplayName: Waypoint Dev
          WAYPOINT_CONTAINER: iCloud.dev.antaeho.waypoint.dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
