name: Waypoint
options:
  bundleIdPrefix: dev.antaeho
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WaypointKit:
    path: .
targets:
  Waypoint:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App
      - path: macOS
        destinationFilters: [macOS]
      - path: iOS
        destinationFilters: [iOS]
    dependencies:
      - package: WaypointKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.antaeho.waypoint
        PRODUCT_NAME: Waypoint
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Waypoint
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
      # Debug는 개발용 Waypoint Dev: 번들 ID가 달라 평소용(Release)과 함께 떠 있을 수 있고,
      # 앱이 이 ID로 포트(47822)·저장 폴더(Waypoint-Dev)를 고른다(`AppInstance`).
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.antaeho.waypoint.dev
          INFOPLIST_KEY_CFBundleDisplayName: Waypoint Dev
