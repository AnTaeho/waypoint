name: Waypoint
options:
  bundleIdPrefix: dev.antaeho
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WaypointKit:
    path: .
targets:
  Waypoint:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App
      - path: macOS
        destinationFilters: [macOS]
      - path: iOS
        destinationFilters: [iOS]
    dependencies:
      - package: WaypointKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.antaeho.waypoint
        PRODUCT_NAME: Waypoint
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Waypoint
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPad 멀티태스킹은 네 방향이 다 있어야 한다(없으면 빌드 경고).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        # 개인 유료 팀. CloudKit·푸시 엔타이틀먼트는 프로파일이 있어야 서명된다(애드혹 서명 불가).
        # 빌드는 `-allowProvisioningUpdates`로 App ID·iCloud 컨테이너·프로파일을 자동으로 만든다.
        DEVELOPMENT_TEAM: 2FCXA77MC5
        CODE_SIGN_IDENTITY: Apple Development
        # CloudKit 컨테이너. 엔타이틀먼트가 이 값을 쓰고, 앱은 `AppInstance.cloudKitContainerIdentifier`로 같은 값을 연다.
        WAYPOINT_CONTAINER: iCloud.dev.antaeho.waypoint
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Waypoint-macOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Config/Waypoint-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Config/Waypoint-iOS.entitlements
        # iOS만: 원격 알림(백그라운드)으로 CloudKit 변경을 받는다. 나머지 Info.plist 키는 생성한다.
        "INFOPLIST_FILE[sdk=iphoneos*]": Config/Waypoint-iOS-Info.plist
        "INFOPLIST_FILE[sdk=iphonesimulator*]": Config/Waypoint-iOS-Info.plist
        SWIFT_STRICT_CONCURRENCY: complete
        # 앱 아이콘(이정표). 원본 SVG는 design/icon/
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Debug는 개발용 Waypoint Dev: 번들 ID가 달라 평소용(Release)과 함께 떠 있을 수 있고,
      # 앱이 이 ID로 포트(47822)·저장 폴더(Waypoint-Dev)를 고른다(`AppInstance`).
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.antaeho.waypoint.dev
          INFOPLIST_KEY_CFBundleDisplayName: Waypoint Dev
          WAYPOINT_CONTAINER: iCloud.dev.antaeho.waypoint.dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
